<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Reproductor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 850px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 25px; font-weight: 600; letter-spacing: -0.5px; }
    
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    input {
      flex: 1;
      padding: 15px 20px;
      border: none;
      border-radius: 30px;
      background: #1c1c1c;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { box-shadow: 0 0 0 2px #1db954; }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #1db954;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #1ed760; transform: scale(1.03); }
    button:disabled { background: #444; cursor: not-allowed; transform: none; }

    .results { display: flex; flex-direction: column; gap: 12px; }
    .result {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #1a1a1a;
      padding: 12px 15px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .result:hover { background: #252525; }
    .result img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
    }
    .info { flex: 1; min-width: 0; }
    .title {
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { font-size: 13px; color: #aaa; }

    .player-section {
      margin-top: 40px;
      background: #1a1a1a;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }
    .now-playing {
      margin-bottom: 15px;
      font-size: 17px;
      font-weight: 500;
    }
    audio {
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .loading {
      text-align: center;
      color: #1db954;
      margin: 25px 0;
      font-size: 16px;
    }
    .error {
      text-align: center;
      color: #ff5555;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mi Reproductor</h1>

    <div class="search-box">
      <input type="text" id="query" placeholder="Escribe canción, artista o lo que quieras..." 
             onkeydown="if(event.key==='Enter') buscar()">
      <button onclick="buscar()" id="btn">Buscar</button>
    </div>

    <div id="loading" class="loading" style="display:none;">Buscando...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div class="results" id="results"></div>

    <div class="player-section" id="playerSection" style="display:none;">
      <div class="now-playing" id="nowPlaying">Reproduciendo...</div>
      <audio id="audio" controls></audio>
    </div>
  </div>

  <script>
    // Se deja vacío porque el HTML se sirve desde el mismo backend
    const API = "";

    async function buscar() {
      const query = document.getElementById("query").value.trim();
      if (!query) return alert("Escribe algo para buscar");

      document.getElementById("btn").disabled = true;
      document.getElementById("loading").style.display = "block";
      document.getElementById("error").style.display = "none";
      document.getElementById("results").innerHTML = "";

      try {
        const res = await fetch(`${API}/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          document.getElementById("results").innerHTML = "<p style='text-align:center;color:#aaa'>No se encontraron resultados</p>";
          return;
        }

        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "result";
          div.innerHTML = `
            <img src="${item.thumbnail || ''}" alt="" onerror="this.style.display='none'">
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="meta">${item.channel || ''} • ${item.duration || ''}</div>
            </div>
          `;
          div.onclick = () => reproducir(item.id, item.title);
          document.getElementById("results").appendChild(div);
        });
      } catch (err) {
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "Error al conectar con el servidor.";
        console.error(err);
      } finally {
        document.getElementById("btn").disabled = false;
        document.getElementById("loading").style.display = "none";
      }
    }

    async function reproducir(id, title) {
      document.getElementById("playerSection").style.display = "block";
      document.getElementById("nowPlaying").textContent = "Cargando: " + title;
      document.getElementById("audio").src = "";

      try {
        const res = await fetch(`${API}/stream?id=${id}`);
        const data = await res.json();

        if (data.url) {
          document.getElementById("nowPlaying").textContent = title;
          const audio = document.getElementById("audio");
          audio.src = data.url;
          audio.play().catch(() => {});
        } else {
          alert("No se pudo obtener el audio de este video");
        }
      } catch (err) {
        alert("Error al obtener el stream");
        console.error(err);
      }
    }
  </script>
</body>
</html>
